[package]
name = "claude-pet"
version = "0.1.0"
edition = "2021"
description = "A desktop pet driven by Claude Code hook events"

[lib]
name = "claude_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
