name: Build macOS

# - push to main / manual run  -> build + upload a workflow artifact (login, expires in 90d)
# - push a version tag (v*)     -> build + publish a GitHub Release with the .dmg attached
#                                  (public download, no login, never expires)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to create a Release on tag push

jobs:
  build-macos:
    runs-on: macos-latest          # macos-latest is Apple Silicon (arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet-app/src-tauri

      # Frontend is static HTML/CSS/JS (no npm build step), so we go straight to
      # the Tauri build → .app + .dmg under
      # pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: pet-app
          args: --target aarch64-apple-darwin

      # Always: workflow artifact (handy for main/manual builds).
      - name: Upload macOS package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: claude-pet-macos-arm64
          if-no-files-found: error
          path: |
            pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      # Only on a version tag (e.g. v0.1.0): publish a Release with the .dmg attached.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
