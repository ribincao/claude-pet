name: Build macOS

# Build a runnable macOS package on every push to main (and on demand).
# The .dmg/.app are uploaded as a downloadable artifact — grab it from the
# run's "Artifacts" section, no signing account needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest          # macos-latest is Apple Silicon (arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet-app/src-tauri

      # Frontend is static HTML/CSS/JS (no npm build step), so we go straight
      # to the Tauri build. This produces the .app and a .dmg under
      # pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: pet-app
          args: --target aarch64-apple-darwin

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: claude-pet-macos-arm64
          if-no-files-found: error
          path: |
            pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            pet-app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
